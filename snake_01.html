<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>簡單貪食蛇小遊戲</title>

  <style>
    /* 整個頁面的基本樣式 */
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      text-align: center;
      background-color: #f0f8ff;
    }

    h1 {
      color: #2c7a7b;
    }

    /* 遊戲畫布 */
    canvas {
      background-color: #ffffff;
      border: 3px solid #2c7a7b;
      margin-top: 10px;
    }

    /* 按鈕樣式 */
    button {
      font-size: 16px;
      padding: 8px 16px;
      margin: 8px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background-color: #38b2ac;
      color: white;
    }

    button:hover {
      background-color: #2c7a7b;
    }

    .box {
      width: 420px;
      margin: auto;
      background: white;
      padding: 15px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <h1>貪食蛇小遊戲</h1>

  <div class="box">
    <p>分數：<span id="score">0</span></p>

    <button onclick="startGame()">開始遊戲</button>
    <button onclick="restartGame()">重新開始</button>

    <br>

    <!-- 遊戲區域 -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <h3>玩法說明</h3>
    <p>
      使用鍵盤方向鍵控制蛇的移動。<br>
      吃到紅色食物可以加分。<br>
      撞到牆壁或自己的身體，遊戲就結束。
    </p>
  </div>

  <script>
    // 取得畫布與繪圖工具
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // 每一格的大小
    const gridSize = 20;

    // 分數
    let score = 0;

    // 蛇的身體，先設定三節
    let snake = [
      { x: 200, y: 200 },
      { x: 180, y: 200 },
      { x: 160, y: 200 }
    ];

    // 食物的位置
    let food = { x: 100, y: 100 };

    // 蛇移動方向
    let dx = gridSize;
    let dy = 0;

    // 遊戲計時器
    let gameInterval;

    // 遊戲是否開始
    let isGameRunning = false;

    // 畫出遊戲畫面
    function drawGame() {
      // 清空畫布
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 畫食物
      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, gridSize, gridSize);

      // 畫蛇
      ctx.fillStyle = "green";
      for (let i = 0; i < snake.length; i++) {
        ctx.fillRect(snake[i].x, snake[i].y, gridSize, gridSize);
      }
    }

    // 移動蛇
    function moveSnake() {
      // 新的蛇頭位置
      const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
      };

      // 把新蛇頭放到最前面
      snake.unshift(head);

      // 判斷是否吃到食物
      if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById("score").textContent = score;
        createFood();
      } else {
        // 沒吃到食物，就移除蛇尾
        snake.pop();
      }
    }

    // 隨機產生食物
    function createFood() {
      food.x = Math.floor(Math.random() * 20) * gridSize;
      food.y = Math.floor(Math.random() * 20) * gridSize;
    }

    // 檢查是否遊戲結束
    function checkGameOver() {
      const head = snake[0];

      // 撞到牆壁
      if (
        head.x < 0 ||
        head.x >= canvas.width ||
        head.y < 0 ||
        head.y >= canvas.height
      ) {
        endGame();
      }

      // 撞到自己的身體
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          endGame();
        }
      }
    }

    // 遊戲主流程
    function gameLoop() {
      moveSnake();
      checkGameOver();
      drawGame();
    }

    // 開始遊戲
    function startGame() {
      if (!isGameRunning) {
        isGameRunning = true;
        gameInterval = setInterval(gameLoop, 150);
      }
    }

    // 結束遊戲
    function endGame() {
      clearInterval(gameInterval);
      isGameRunning = false;
      alert("遊戲結束！你的分數是：" + score);
    }

    // 重新開始遊戲
    function restartGame() {
      clearInterval(gameInterval);

      score = 0;
      document.getElementById("score").textContent = score;

      snake = [
        { x: 200, y: 200 },
        { x: 180, y: 200 },
        { x: 160, y: 200 }
      ];

      food = { x: 100, y: 100 };

      dx = gridSize;
      dy = 0;

      isGameRunning = false;

      drawGame();
    }

    // 監聽鍵盤方向鍵
    document.addEventListener("keydown", function(event) {
      if (event.key === "ArrowUp" && dy === 0) {
        dx = 0;
        dy = -gridSize;
      } else if (event.key === "ArrowDown" && dy === 0) {
        dx = 0;
        dy = gridSize;
      } else if (event.key === "ArrowLeft" && dx === 0) {
        dx = -gridSize;
        dy = 0;
      } else if (event.key === "ArrowRight" && dx === 0) {
        dx = gridSize;
        dy = 0;
      }
    });

    // 一開始先畫出初始畫面
    drawGame();
  </script>

</body>
</html>
